server:
  port: 8080

spring:
  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:file:backend/.env[.properties]"
  application:
    name: movie-app
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/moviedb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:Rushi@09}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

tmdb:
  api:
    token: ${TMDB_TOKEN:}
    base-url: https://api.themoviedb.org/3

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971}
  expiration: 86400000 # 24 hours in ms

logging:
  level:
    com.moviesuggestion: DEBUG
    org.springframework.security: INFO
